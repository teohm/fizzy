# Offences we have agreed to live with for now, parked here rather than fixed. Kept even
# when empty, as it is today: this is where the next batch lands, and a file that exists is
# one nobody has to decide to create at the moment they are busy loosening something.
#
# Regenerate with:
#
#     bundle exec rubocop --auto-gen-config --only Minitest --no-exclude-limit
#
# --no-exclude-limit is the part that matters. Left to itself rubocop switches a cop off
# entirely once it fails in more than 15 files, which parks the backlog by making the cop
# useless everywhere else. Listing the files keeps every cop live on every file it does not
# already fail on, so tomorrow's violation is caught tomorrow.
#
# What is here is debt: offences that exist and are waiting. What is in .rubocop.yml is a
# decision: a cop we do not want, or a threshold we set on purpose. Anything read off this
# file counts only the first, so it undercounts by whatever the second is hiding -- today,
# 218 tests above the gem's default Max for MultipleAssertions, and 763 offences from the
# three cops switched off there.
